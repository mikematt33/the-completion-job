name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the current one rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm test
      - run: node --check app.js && node --check planner.js && node --check sw.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Only the files the browser needs go to Pages. Tests, scripts, and docs stay out.
      - name: Stage site files
        run: |
          mkdir -p _site/icons
          cp index.html styles.css app.js planner.js sw.js manifest.webmanifest favicon.svg _site/
          cp icons/* _site/icons/

      # Give the service worker a cache name unique to this commit so visitors pick up the new files.
      - name: Stamp service worker cache
        run: sed -i "s/const CACHE = '[^']*';/const CACHE = 'the-completion-job-${GITHUB_SHA::7}';/" _site/sw.js && grep "const CACHE" _site/sw.js

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
